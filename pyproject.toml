[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atp"
version = "0.1.0"
description = "Autonomous Multi-Asset Trading platform (Gesamtkonzept V1.0)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Live/production extras (not needed for the offline test suite).
live = [
    "ib-insync>=0.9.86",   # IBKR / IB Gateway adapter (§17)
    "fastapi>=0.110",      # backend API (§21)
    "uvicorn>=0.29",
    "redis>=5.0",          # realtime state (§21)
    "psycopg[binary]>=3.1",# PostgreSQL (§21)
]
ml = ["scikit-learn>=1.4", "xgboost>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
gigbay-autopilot = "atp.autopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Async tests are plain `async def` — no per-test decorator needed.
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["src", "tests"]
