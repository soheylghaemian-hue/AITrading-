name: Claude Writer - Codex Orchestrator

on:
  pull_request: {}
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      goal_id:
        description: Optional trusted goal id from autopilot/queue.json
        required: false
        type: string

permissions: {}

concurrency:
  group: gigbay-claude-codex-autopilot
  cancel-in-progress: true

env:
  WORKBENCH_BRANCH: claude/autopilot-workbench

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      control_sha: ${{ steps.select.outputs.control_sha }}
      base_sha: ${{ steps.select.outputs.base_sha }}
      has_goal: ${{ steps.goal.outputs.has_goal }}
      goal_id: ${{ steps.goal.outputs.goal_id }}
      goal_file: ${{ steps.goal.outputs.goal_file }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable control and workbench
        id: select
        env:
          CONTROL_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" != "refs/heads/main" ] && [ "${GITHUB_REF}" != "refs/heads/codex/fix-claude-auth" ]; then
            echo "Autopilot dispatch is allowed only from main (or the temporary authenticated test branch)"
            exit 2
          fi
          control_sha="$(git rev-parse HEAD)"
          if [ "${control_sha}" != "${CONTROL_REF}" ]; then
            echo "Control checkout does not match the triggering commit"
            exit 2
          fi
          if git fetch origin "refs/heads/${WORKBENCH_BRANCH}:refs/remotes/origin/${WORKBENCH_BRANCH}"; then
            base_sha="$(git rev-parse "refs/remotes/origin/${WORKBENCH_BRANCH}")"
          else
            git fetch origin "refs/heads/main:refs/remotes/origin/main"
            base_sha="$(git rev-parse "refs/remotes/origin/main")"
          fi
          printf 'control_sha=%s\nbase_sha=%s\n' "${control_sha}" "${base_sha}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ steps.select.outputs.base_sha }}
          path: candidate
          persist-credentials: false
      - name: Select trusted goal from the immutable candidate
        id: goal
        env:
          REQUESTED_GOAL: ${{ inputs.goal_id }}
          EXPECTED_CONTROL_SHA: ${{ steps.select.outputs.control_sha }}
          EXPECTED_BASE_SHA: ${{ steps.select.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_CONTROL_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${EXPECTED_BASE_SHA}"
          PYTHONPATH=src python -m atp.autopilot.queue --repo candidate --requested "${REQUESTED_GOAL}" --github-output "${GITHUB_OUTPUT}"

  plan:
    needs: prepare
    if: needs.prepare.outputs.has_goal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      plan_json: ${{ steps.codex-plan.outputs.final-message }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: candidate
          persist-credentials: false
      - name: Verify immutable control and candidate checkouts
        env:
          EXPECTED_CONTROL_SHA: ${{ needs.prepare.outputs.control_sha }}
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_CONTROL_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${EXPECTED_BASE_SHA}"
      - name: Prepare trusted planner context
        env:
          GOAL_FILE: ${{ needs.prepare.outputs.goal_file }}
        working-directory: candidate
        run: |
          mkdir -p .autopilot
          printf '%s\n' "${GOAL_FILE}" > .autopilot/goal-path.txt
      - name: Codex creates the plan read-only
        id: codex-plan
        uses: openai/codex-action@c385816875cc2fc8e033ed9d1cba96f8c331210e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ github.workspace }}/.github/autopilot/prompts/plan.md
          output-file: ${{ github.workspace }}/candidate/.autopilot/plan.json
          output-schema-file: ${{ github.workspace }}/.github/autopilot/schemas/plan.schema.json
          working-directory: ${{ github.workspace }}/candidate
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'
          effort: high
          allow-bots: true

  author:
    needs: [prepare, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      patch_json: ${{ steps.claude-author.outputs.structured_output }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: candidate
          persist-credentials: false
      - name: Verify immutable control and candidate checkouts
        env:
          EXPECTED_CONTROL_SHA: ${{ needs.prepare.outputs.control_sha }}
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_CONTROL_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${EXPECTED_BASE_SHA}"
      - name: Prepare trusted Claude context
        env:
          GOAL_FILE: ${{ needs.prepare.outputs.goal_file }}
          PLAN_JSON: ${{ needs.plan.outputs.plan_json }}
        working-directory: candidate
        run: |
          mkdir -p .autopilot
          printf '%s\n' "${GOAL_FILE}" > .autopilot/goal-path.txt
          printf '%s' "${PLAN_JSON}" > .autopilot/plan.json
      - name: Normalize Claude OAuth token without exposing it
        id: claude_token
        env:
          RAW_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          token="$(printf '%s' "${RAW_CLAUDE_TOKEN}" | tr -d '[:space:]')"
          if [ -z "${token}" ]; then
            echo "Claude OAuth token is empty after normalization"
            exit 2
          fi
          case "${token}" in
            sk-ant-oat*) ;;
            *) echo "Claude OAuth token has an unexpected format"; exit 2 ;;
          esac
          printf '::add-mask::%s\n' "${token}"
          printf 'token=%s\n' "${token}" >> "${GITHUB_OUTPUT}"
      - name: Claude authors a structured patch without write or shell tools
        id: claude-author
        uses: anthropics/claude-code-base-action@de0c38b60731a9ab4d9637bf4ec3b9679d12c96a
        env:
          CLAUDE_WORKING_DIR: ${{ github.workspace }}/candidate
        with:
          prompt_file: ${{ github.workspace }}/.github/autopilot/prompts/claude-author.md
          claude_code_oauth_token: ${{ steps.claude_token.outputs.token }}
          show_full_output: "false"
          claude_args: >-
            --model opus
            --max-turns 30
            --max-budget-usd 25
            --allowedTools "Read,Glob,Grep"
            --disallowedTools "Bash,Edit,Write,NotebookEdit,WebFetch,WebSearch,Task,mcp__*"
            --json-schema '{"type":"object","additionalProperties":false,"required":["author","summary","patch","changed_files"],"properties":{"author":{"type":"string","enum":["claude"]},"summary":{"type":"string","maxLength":2000},"patch":{"type":"string"},"changed_files":{"type":"array","minItems":1,"maxItems":80,"uniqueItems":true,"items":{"type":"string"}}}}'

      - name: Report redacted Claude startup error
        if: ${{ failure() && steps.claude-author.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.claude-author.outputs.execution_file }}
        run: |
          python - <<'PY'
          import json
          import os
          import re

          with open(os.environ["EXECUTION_FILE"], encoding="utf-8") as handle:
              messages = json.load(handle)
          result = next(
              (item for item in reversed(messages) if item.get("type") == "result"),
              {},
          )
          payload = {
              "subtype": result.get("subtype"),
              "is_error": result.get("is_error"),
              "errors": result.get("errors"),
              "result": result.get("result"),
          }
          safe = json.dumps(payload, ensure_ascii=True)
          safe = re.sub(r"sk-[A-Za-z0-9_-]{8,}", "[REDACTED_KEY]", safe)
          safe = re.sub(
              r"(?i)((?:api[_ -]?key|oauth[_ -]?token|authorization)\s*[:=]\s*)\S+",
              r"\1[REDACTED]",
              safe,
          )
          safe = re.sub(
              r"(?<![A-Za-z0-9])[A-Za-z0-9_-]{40,}(?![A-Za-z0-9])",
              "[REDACTED_LONG_TOKEN]",
              safe,
          )
          print("Sanitized Claude startup result:")
          print(safe[:4000])
          PY

  gate:
    needs: [prepare, author]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: candidate
          persist-credentials: false
      - name: Verify immutable control and candidate checkouts
        env:
          EXPECTED_CONTROL_SHA: ${{ needs.prepare.outputs.control_sha }}
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_CONTROL_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${EXPECTED_BASE_SHA}"
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: "3.12"
      - uses: actions/setup-node@3d7870f6218881292d183093179901ae8dc2ef85
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: candidate/frontend/package-lock.json
      - name: Validate and apply Claude patch
        env:
          PATCH_JSON: ${{ needs.author.outputs.patch_json }}
          GOAL_FILE: ${{ needs.prepare.outputs.goal_file }}
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p .autopilot
          printf '%s' "${PATCH_JSON}" > .autopilot/claude.json
          python -m pip install -e '.[dev,live]'
          PYTHONPATH="${GITHUB_WORKSPACE}/src" python -m atp.autopilot.guard --repo . --goal "${GOAL_FILE}" --declared-json .autopilot/claude.json --declared-only
          python -c 'import json; from pathlib import Path; source = Path(".autopilot/claude.json"); patch = json.loads(source.read_text(encoding="utf-8"))["patch"]; Path(".autopilot/candidate.patch").write_text(patch.rstrip(chr(13) + chr(10)) + chr(10), encoding="utf-8")'
          git apply --check --recount --whitespace=error .autopilot/candidate.patch
          git apply --intent-to-add --recount --whitespace=error .autopilot/candidate.patch
          PYTHONPATH="${GITHUB_WORKSPACE}/src" python -m atp.autopilot.guard --repo . --goal "${GOAL_FILE}" --declared-json .autopilot/claude.json
          git diff --check
          git diff --binary HEAD > .autopilot/candidate.patch
          sha256sum .autopilot/candidate.patch > .autopilot/candidate.patch.sha256
      - name: Run deterministic evidence suite
        working-directory: candidate
        run: |
          set -euo pipefail
          python -m pytest 2>&1 | tee .autopilot/test-evidence.txt
          (cd frontend && npm ci && npm test -- --run && npm run build) 2>&1 | tee -a .autopilot/test-evidence.txt
          git diff --check
          sha256sum -c .autopilot/candidate.patch.sha256
          git diff --binary HEAD > .autopilot/post-test.patch
          if ! cmp --silent .autopilot/candidate.patch .autopilot/post-test.patch; then
            echo "Tests changed the candidate worktree; refusing mutable evidence"
            exit 2
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-${{ github.run_id }}
          path: |
            candidate/.autopilot/candidate.patch
            candidate/.autopilot/candidate.patch.sha256
            candidate/.autopilot/test-evidence.txt
          retention-days: 7

  review:
    needs: [prepare, plan, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      approved: ${{ fromJSON(steps.codex-review.outputs.final-message).approved }}
      review_json: ${{ steps.codex-review.outputs.final-message }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: candidate
          persist-credentials: false
      - name: Verify immutable control and candidate checkouts
        env:
          EXPECTED_CONTROL_SHA: ${{ needs.prepare.outputs.control_sha }}
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_CONTROL_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${EXPECTED_BASE_SHA}"
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: candidate-${{ github.run_id }}
          path: candidate/.autopilot
      - name: Prepare read-only review context
        env:
          GOAL_FILE: ${{ needs.prepare.outputs.goal_file }}
          PLAN_JSON: ${{ needs.plan.outputs.plan_json }}
        working-directory: candidate
        run: |
          printf '%s\n' "${GOAL_FILE}" > .autopilot/goal-path.txt
          printf '%s' "${PLAN_JSON}" > .autopilot/plan.json
          sha256sum -c .autopilot/candidate.patch.sha256
          git apply --check --whitespace=error .autopilot/candidate.patch
          git apply --intent-to-add --whitespace=error .autopilot/candidate.patch
      - name: Codex independently reviews read-only
        id: codex-review
        uses: openai/codex-action@c385816875cc2fc8e033ed9d1cba96f8c331210e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ github.workspace }}/.github/autopilot/prompts/review.md
          output-file: ${{ github.workspace }}/candidate/.autopilot/review.json
          output-schema-file: ${{ github.workspace }}/.github/autopilot/schemas/review.schema.json
          working-directory: ${{ github.workspace }}/candidate
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'
          effort: high
          allow-bots: true

  repair:
    needs: [prepare, plan, gate, review]
    if: needs.review.outputs.approved != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      patch_json: ${{ steps.claude-repair.outputs.structured_output }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: candidate
          persist-credentials: false
      - name: Verify immutable control and candidate checkouts
        env:
          EXPECTED_CONTROL_SHA: ${{ needs.prepare.outputs.control_sha }}
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_CONTROL_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${EXPECTED_BASE_SHA}"
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: candidate-${{ github.run_id }}
          path: candidate/.autopilot
      - name: Prepare repair context
        env:
          GOAL_FILE: ${{ needs.prepare.outputs.goal_file }}
          PLAN_JSON: ${{ needs.plan.outputs.plan_json }}
          REVIEW_JSON: ${{ needs.review.outputs.review_json }}
        working-directory: candidate
        run: |
          sha256sum -c .autopilot/candidate.patch.sha256
          git apply --check --whitespace=error .autopilot/candidate.patch
          git apply --intent-to-add --whitespace=error .autopilot/candidate.patch
          printf '%s\n' "${GOAL_FILE}" > .autopilot/goal-path.txt
          printf '%s' "${PLAN_JSON}" > .autopilot/plan.json
          printf '%s' "${REVIEW_JSON}" > .autopilot/review.json
      - name: Normalize Claude OAuth token without exposing it
        id: claude_token
        env:
          RAW_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          token="$(printf '%s' "${RAW_CLAUDE_TOKEN}" | tr -d '[:space:]')"
          if [ -z "${token}" ]; then
            echo "Claude OAuth token is empty after normalization"
            exit 2
          fi
          case "${token}" in
            sk-ant-oat*) ;;
            *) echo "Claude OAuth token has an unexpected format"; exit 2 ;;
          esac
          printf '::add-mask::%s\n' "${token}"
          printf 'token=%s\n' "${token}" >> "${GITHUB_OUTPUT}"
      - name: Claude authors one bounded repair patch
        id: claude-repair
        uses: anthropics/claude-code-base-action@de0c38b60731a9ab4d9637bf4ec3b9679d12c96a
        env:
          CLAUDE_WORKING_DIR: ${{ github.workspace }}/candidate
        with:
          prompt_file: ${{ github.workspace }}/.github/autopilot/prompts/claude-repair.md
          claude_code_oauth_token: ${{ steps.claude_token.outputs.token }}
          show_full_output: "false"
          claude_args: >-
            --model opus
            --max-turns 25
            --max-budget-usd 20
            --allowedTools "Read,Glob,Grep"
            --disallowedTools "Bash,Edit,Write,NotebookEdit,WebFetch,WebSearch,Task,mcp__*"
            --json-schema '{"type":"object","additionalProperties":false,"required":["author","summary","patch","changed_files"],"properties":{"author":{"type":"string","enum":["claude"]},"summary":{"type":"string","maxLength":2000},"patch":{"type":"string"},"changed_files":{"type":"array","minItems":1,"maxItems":80,"uniqueItems":true,"items":{"type":"string"}}}}'

  gate_repair:
    needs: [prepare, gate, review, repair]
    if: needs.review.outputs.approved != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: candidate
          persist-credentials: false
      - name: Verify immutable control and candidate checkouts
        env:
          EXPECTED_CONTROL_SHA: ${{ needs.prepare.outputs.control_sha }}
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_CONTROL_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${EXPECTED_BASE_SHA}"
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: "3.12"
      - uses: actions/setup-node@3d7870f6218881292d183093179901ae8dc2ef85
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: candidate/frontend/package-lock.json
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: candidate-${{ github.run_id }}
          path: candidate/.autopilot
      - name: Validate and apply bounded repair
        env:
          REPAIR_JSON: ${{ needs.repair.outputs.patch_json }}
          GOAL_FILE: ${{ needs.prepare.outputs.goal_file }}
        working-directory: candidate
        run: |
          set -euo pipefail
          printf '%s' "${REPAIR_JSON}" > .autopilot/repair.json
          python -m pip install -e '.[dev,live]'
          PYTHONPATH="${GITHUB_WORKSPACE}/src" python -m atp.autopilot.guard --repo . --goal "${GOAL_FILE}" --declared-json .autopilot/repair.json --declared-only
          sha256sum -c .autopilot/candidate.patch.sha256
          git apply --check --whitespace=error .autopilot/candidate.patch
          git apply --intent-to-add --whitespace=error .autopilot/candidate.patch
          git add -A
          git -c user.name=autopilot-gate -c user.email=autopilot-gate@users.noreply.github.com -c commit.gpgsign=false commit -m "Temporary candidate baseline"
          python -c 'import json; from pathlib import Path; source = Path(".autopilot/repair.json"); patch = json.loads(source.read_text(encoding="utf-8"))["patch"]; Path(".autopilot/repair.patch").write_text(patch.rstrip(chr(13) + chr(10)) + chr(10), encoding="utf-8")'
          git apply --check --recount --whitespace=error .autopilot/repair.patch
          git apply --intent-to-add --recount --whitespace=error .autopilot/repair.patch
          PYTHONPATH="${GITHUB_WORKSPACE}/src" python -m atp.autopilot.guard --repo . --goal "${GOAL_FILE}" --declared-json .autopilot/repair.json
          git diff --check HEAD^
          git diff --binary HEAD^ > .autopilot/repaired.patch
          sha256sum .autopilot/repaired.patch > .autopilot/repaired.patch.sha256
      - name: Re-run deterministic evidence suite
        working-directory: candidate
        run: |
          set -euo pipefail
          python -m pytest 2>&1 | tee .autopilot/test-evidence.txt
          (cd frontend && npm ci && npm test -- --run && npm run build) 2>&1 | tee -a .autopilot/test-evidence.txt
          git diff --check HEAD^
          sha256sum -c .autopilot/repaired.patch.sha256
          git diff --binary HEAD^ > .autopilot/post-test-repaired.patch
          if ! cmp --silent .autopilot/repaired.patch .autopilot/post-test-repaired.patch; then
            echo "Tests changed the repaired worktree; refusing mutable evidence"
            exit 2
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repaired-${{ github.run_id }}
          path: |
            candidate/.autopilot/repaired.patch
            candidate/.autopilot/repaired.patch.sha256
            candidate/.autopilot/test-evidence.txt
          retention-days: 7

  final_review:
    needs: [prepare, plan, review, gate_repair]
    if: needs.review.outputs.approved != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      approved: ${{ fromJSON(steps.codex-final.outputs.final-message).approved }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: candidate
          persist-credentials: false
      - name: Verify immutable control and candidate checkouts
        env:
          EXPECTED_CONTROL_SHA: ${{ needs.prepare.outputs.control_sha }}
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_CONTROL_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${EXPECTED_BASE_SHA}"
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: repaired-${{ github.run_id }}
          path: candidate/.autopilot
      - name: Prepare final read-only review
        env:
          GOAL_FILE: ${{ needs.prepare.outputs.goal_file }}
          PLAN_JSON: ${{ needs.plan.outputs.plan_json }}
        working-directory: candidate
        run: |
          printf '%s\n' "${GOAL_FILE}" > .autopilot/goal-path.txt
          printf '%s' "${PLAN_JSON}" > .autopilot/plan.json
          sha256sum -c .autopilot/repaired.patch.sha256
          git apply --check --whitespace=error .autopilot/repaired.patch
          git apply --intent-to-add --whitespace=error .autopilot/repaired.patch
      - name: Codex gives the final independent verdict
        id: codex-final
        uses: openai/codex-action@c385816875cc2fc8e033ed9d1cba96f8c331210e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ github.workspace }}/.github/autopilot/prompts/review.md
          output-file: ${{ github.workspace }}/candidate/.autopilot/final-review.json
          output-schema-file: ${{ github.workspace }}/.github/autopilot/schemas/review.schema.json
          working-directory: ${{ github.workspace }}/candidate
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'
          effort: high
          allow-bots: true

  publish:
    needs: [prepare, plan, author, gate, review, repair, gate_repair, final_review]
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      (needs.review.outputs.approved == 'true' ||
       (needs.gate_repair.result == 'success' && needs.final_review.outputs.approved == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: candidate
          fetch-depth: 0
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: ${{ needs.review.outputs.approved == 'true' && format('candidate-{0}', github.run_id) || format('repaired-{0}', github.run_id) }}
          path: candidate/.autopilot
      - name: Publish only the reviewed patch to the workbench draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          GOAL_ID: ${{ needs.prepare.outputs.goal_id }}
          APPROVED_FIRST: ${{ needs.review.outputs.approved }}
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        working-directory: candidate
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "${EXPECTED_BASE_SHA}" ]; then
            echo "Publisher checkout does not match the reviewed base"
            exit 2
          fi
          git fetch origin "refs/heads/${WORKBENCH_BRANCH}:refs/remotes/origin/${WORKBENCH_BRANCH}"
          if [ "$(git rev-parse "refs/remotes/origin/${WORKBENCH_BRANCH}")" != "${EXPECTED_BASE_SHA}" ]; then
            echo "Workbench advanced after review; refusing stale publication"
            exit 2
          fi
          if [ "${APPROVED_FIRST}" = "true" ]; then
            PATCH=.autopilot/candidate.patch
            sha256sum -c .autopilot/candidate.patch.sha256
          else
            PATCH=.autopilot/repaired.patch
            sha256sum -c .autopilot/repaired.patch.sha256
          fi
          git apply --check --whitespace=error "${PATCH}"
          git apply --intent-to-add --whitespace=error "${PATCH}"
          mkdir -p docs/autopilot/completed
          jq -n --arg goal "${GOAL_ID}" --arg run "${GITHUB_RUN_ID}" '{goal_id: $goal, github_run_id: $run, status: "CODEX_APPROVED"}' > "docs/autopilot/completed/${GOAL_ID}.json"
          git config user.name "claude-autopilot[bot]"
          git config user.email "claude-autopilot[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Claude: complete ${GOAL_ID}"
          git push origin "HEAD:refs/heads/${WORKBENCH_BRANCH}"
          PR_NUMBER="$(gh pr list --head "${WORKBENCH_BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if [ -z "${PR_NUMBER}" ]; then
            gh pr create --draft --base main --head "${WORKBENCH_BRANCH}" --title "GIGBAY Trader Brain - Claude workbench" --body "Claude authors every code patch. Codex plans and independently reviews. Deterministic gates run before this branch is updated. No production, broker, execution, leverage, secrets or real money."
          else
            gh pr comment "${PR_NUMBER}" --body "Completed trusted goal \`${GOAL_ID}\` in run \`${GITHUB_RUN_ID}\`. Claude authored; Codex approved; deterministic gates passed."
          fi
