name: Claude Writer - Codex Orchestrator

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      goal_id:
        description: Optional trusted goal id from autopilot/queue.json
        required: false
        type: string

permissions: {}

concurrency:
  group: gigbay-claude-codex-autopilot
  cancel-in-progress: false

env:
  WORKBENCH_BRANCH: claude/autopilot-workbench
  WORKBENCH_PR_NUMBER: "3"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      control_sha: ${{ steps.select.outputs.control_sha }}
      base_sha: ${{ steps.select.outputs.base_sha }}
      has_goal: ${{ steps.goal.outputs.has_goal }}
      goal_id: ${{ steps.goal.outputs.goal_id }}
      goal_file: ${{ steps.goal.outputs.goal_file }}
      control_feedback_present: ${{ steps.feedback.outputs.has_feedback }}
      control_feedback_sha256: ${{ steps.feedback.outputs.feedback_sha256 }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable control and workbench
        id: select
        env:
          CONTROL_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Autopilot dispatch is allowed only from main"
            exit 2
          fi
          control_sha="$(git rev-parse HEAD)"
          if [ "${control_sha}" != "${CONTROL_REF}" ]; then
            echo "Control checkout does not match the triggering commit"
            exit 2
          fi
          if git fetch origin "refs/heads/${WORKBENCH_BRANCH}:refs/remotes/origin/${WORKBENCH_BRANCH}"; then
            base_sha="$(git rev-parse "refs/remotes/origin/${WORKBENCH_BRANCH}")"
          else
            git fetch origin "refs/heads/main:refs/remotes/origin/main"
            base_sha="$(git rev-parse "refs/remotes/origin/main")"
          fi
          printf 'control_sha=%s\nbase_sha=%s\n' "${control_sha}" "${base_sha}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ steps.select.outputs.base_sha }}
          path: candidate
          persist-credentials: false
      - name: Select trusted goal from the immutable candidate
        id: goal
        env:
          REQUESTED_GOAL: ${{ inputs.goal_id }}
          EXPECTED_CONTROL_SHA: ${{ steps.select.outputs.control_sha }}
          EXPECTED_BASE_SHA: ${{ steps.select.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_CONTROL_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${EXPECTED_BASE_SHA}"
          PYTHONPATH=src python -m atp.autopilot.queue --repo candidate --requested "${REQUESTED_GOAL}" --github-output "${GITHUB_OUTPUT}"
      - name: Bind trusted goal-bound review feedback
        id: feedback
        if: steps.goal.outputs.has_goal == 'true'
        env:
          GOAL_FILE: ${{ steps.goal.outputs.goal_file }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m atp.autopilot.feedback \
            --repo candidate \
            --control-root . \
            --goal "${GOAL_FILE}" \
            --github-output "${GITHUB_OUTPUT}"

  plan:
    needs: prepare
    if: needs.prepare.outputs.has_goal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.bind-plan.outputs.artifact_name }}
      model_sha256: ${{ steps.bind-plan.outputs.model_sha256 }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: candidate
          persist-credentials: false
      - name: Verify immutable control and candidate checkouts
        env:
          EXPECTED_CONTROL_SHA: ${{ needs.prepare.outputs.control_sha }}
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_CONTROL_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${EXPECTED_BASE_SHA}"
      - name: Materialize trusted goal-bound review feedback
        env:
          GOAL_FILE: ${{ needs.prepare.outputs.goal_file }}
          EXPECTED_CONTROL_FEEDBACK_SHA256: ${{ needs.prepare.outputs.control_feedback_sha256 }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m atp.autopilot.feedback \
            --repo candidate \
            --control-root . \
            --goal "${GOAL_FILE}" \
            --expected-sha256 "${EXPECTED_CONTROL_FEEDBACK_SHA256}" \
            --materialize
      - name: Prepare trusted planner context
        env:
          GOAL_FILE: ${{ needs.prepare.outputs.goal_file }}
        working-directory: candidate
        run: |
          mkdir -p .autopilot
          printf '%s\n' "${GOAL_FILE}" > .autopilot/goal-path.txt
      - name: Prepare the private Codex runtime without a prompt
        uses: openai/codex-action@c385816875cc2fc8e033ed9d1cba96f8c331210e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: ${{ runner.temp }}/codex-home
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          allow-bots: true
      - name: Codex creates the plan read-only without log disclosure
        working-directory: ${{ github.workspace }}/candidate
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_PROMPT_FILE: ${{ github.workspace }}/.github/autopilot/prompts/plan.md
          CODEX_OUTPUT_FILE: ${{ github.workspace }}/candidate/.autopilot/plan.json
          CODEX_OUTPUT_SCHEMA_FILE: ${{ github.workspace }}/.github/autopilot/schemas/plan.schema.json
          CODEX_INTERNAL_ORIGINATOR_OVERRIDE: codex_github_action
          FORCE_COLOR: "1"
        run: |
          set -euo pipefail
          umask 077
          private_log="$(mktemp "${RUNNER_TEMP}/codex-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")"
          cleanup_private_codex_log() {
            rm -f -- "${private_log}"
          }
          trap cleanup_private_codex_log EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          chmod 600 "${private_log}"
          test "$(stat -c '%a' "${private_log}")" = "600"
          test -f "${CODEX_PROMPT_FILE}"
          test ! -L "${CODEX_PROMPT_FILE}"
          test -f "${CODEX_OUTPUT_SCHEMA_FILE}"
          test ! -L "${CODEX_OUTPUT_SCHEMA_FILE}"
          test ! -e "${CODEX_OUTPUT_FILE}"
          test ! -L "${CODEX_OUTPUT_FILE}"
          codex exec \
            --skip-git-repo-check \
            --cd "${GITHUB_WORKSPACE}/candidate" \
            --output-last-message "${CODEX_OUTPUT_FILE}" \
            --output-schema "${CODEX_OUTPUT_SCHEMA_FILE}" \
            --config 'model_reasoning_effort="high"' \
            --ephemeral \
            --config 'default_permissions=":read-only"' \
            < "${CODEX_PROMPT_FILE}" \
            > "${private_log}" 2>&1
          test -s "${CODEX_OUTPUT_FILE}"
      - name: Bind trusted planner output
        id: bind-plan
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m atp.autopilot.model_output \
            --repo candidate \
            --phase plan \
            --bind \
            --github-output "${GITHUB_OUTPUT}"
          printf 'artifact_name=model-plan-%s-%s\n' \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.bind-plan.outputs.artifact_name }}
          path: candidate/.autopilot/plan.json
          if-no-files-found: error
          retention-days: 1

  author:
    needs: [prepare, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.bind-author.outputs.artifact_name }}
      model_sha256: ${{ steps.bind-author.outputs.model_sha256 }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: candidate
          persist-credentials: false
      - name: Verify immutable control and candidate checkouts
        env:
          EXPECTED_CONTROL_SHA: ${{ needs.prepare.outputs.control_sha }}
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_CONTROL_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${EXPECTED_BASE_SHA}"
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: candidate/.autopilot
      - name: Materialize trusted goal-bound review feedback
        env:
          GOAL_FILE: ${{ needs.prepare.outputs.goal_file }}
          EXPECTED_CONTROL_FEEDBACK_SHA256: ${{ needs.prepare.outputs.control_feedback_sha256 }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m atp.autopilot.feedback \
            --repo candidate \
            --control-root . \
            --goal "${GOAL_FILE}" \
            --expected-sha256 "${EXPECTED_CONTROL_FEEDBACK_SHA256}" \
            --materialize
      - name: Prepare trusted Claude context
        env:
          GOAL_FILE: ${{ needs.prepare.outputs.goal_file }}
          EXPECTED_MODEL_SHA256: ${{ needs.plan.outputs.model_sha256 }}
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p .autopilot
          PYTHONPATH="${GITHUB_WORKSPACE}/src" python -m atp.autopilot.model_output \
            --repo . \
            --phase plan \
            --verify \
            --expected-sha256 "${EXPECTED_MODEL_SHA256}"
          printf '%s\n' "${GOAL_FILE}" > .autopilot/goal-path.txt
      - name: Normalize Claude OAuth token without exposing it
        id: claude_token
        env:
          RAW_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os

          raw = os.environ.get("RAW_CLAUDE_TOKEN", "")
          token = raw.replace("\r", "").replace("\n", "")
          if not token:
              raise SystemExit("Claude OAuth token is empty after normalization")
          if any(character.isspace() for character in token):
              raise SystemExit("Claude OAuth token contains unsupported whitespace")
          if not token.startswith("sk-ant-oat"):
              raise SystemExit("Claude OAuth token has an unexpected format")
          print(f"::add-mask::{token}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"token={token}\n")
          PY
      - name: Claude authors a structured patch without write or shell tools
        id: claude-author
        uses: anthropics/claude-code-base-action@de0c38b60731a9ab4d9637bf4ec3b9679d12c96a
        env:
          CLAUDE_WORKING_DIR: ${{ github.workspace }}/candidate
        with:
          prompt_file: ${{ github.workspace }}/.github/autopilot/prompts/claude-author.md
          claude_code_oauth_token: ${{ steps.claude_token.outputs.token }}
          show_full_output: "false"
          claude_args: >-
            --model opus
            --max-turns 30
            --max-budget-usd 25
            --allowedTools "Read,Glob,Grep"
            --disallowedTools "Bash,Edit,Write,NotebookEdit,WebFetch,WebSearch,Task,mcp__*"
            --json-schema '{"type":"object","additionalProperties":false,"required":["author","patch","changed_files"],"properties":{"author":{"type":"string","enum":["claude"]},"patch":{"type":"string"},"changed_files":{"type":"array","minItems":1,"items":{"type":"string"}}}}'
      - name: Bind trusted author output
        id: bind-author
        env:
          EXECUTION_FILE: ${{ steps.claude-author.outputs.execution_file }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m atp.autopilot.model_output \
            --repo candidate \
            --phase author \
            --bind \
            --execution-file "${EXECUTION_FILE}" \
            --runner-temp "${RUNNER_TEMP}" \
            --github-output "${GITHUB_OUTPUT}"
          printf 'artifact_name=model-author-%s-%s\n' \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.bind-author.outputs.artifact_name }}
          path: candidate/.autopilot/claude.json
          if-no-files-found: error
          retention-days: 1

  gate:
    needs: [prepare, author]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.candidate-artifact.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: candidate
          persist-credentials: false
      - name: Verify immutable control and candidate checkouts
        env:
          EXPECTED_CONTROL_SHA: ${{ needs.prepare.outputs.control_sha }}
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_CONTROL_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${EXPECTED_BASE_SHA}"
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: "3.12"
      - uses: actions/setup-node@3d7870f6218881292d183093179901ae8dc2ef85
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: candidate/frontend/package-lock.json
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: ${{ needs.author.outputs.artifact_name }}
          path: candidate/.autopilot
      - name: Validate and apply Claude patch
        env:
          GOAL_FILE: ${{ needs.prepare.outputs.goal_file }}
          EXPECTED_MODEL_SHA256: ${{ needs.author.outputs.model_sha256 }}
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p .autopilot
          PYTHONPATH="${GITHUB_WORKSPACE}/src" python -m atp.autopilot.model_output \
            --repo . \
            --phase author \
            --verify \
            --expected-sha256 "${EXPECTED_MODEL_SHA256}"
          python -m pip install -e '.[dev,live]'
          PYTHONPATH="${GITHUB_WORKSPACE}/src" python -m atp.autopilot.guard --repo . --goal "${GOAL_FILE}" --declared-json .autopilot/claude.json --declared-only
          python -c 'import json; from pathlib import Path; source = Path(".autopilot/claude.json"); patch = json.loads(source.read_text(encoding="utf-8"))["patch"]; Path(".autopilot/candidate.patch").write_text(patch.rstrip(chr(13) + chr(10)) + chr(10), encoding="utf-8")'
          git apply --check --recount --whitespace=error .autopilot/candidate.patch
          git apply --intent-to-add --recount --whitespace=error .autopilot/candidate.patch
          PYTHONPATH="${GITHUB_WORKSPACE}/src" python -m atp.autopilot.guard --repo . --goal "${GOAL_FILE}" --declared-json .autopilot/claude.json
          git diff --check
          git diff --binary HEAD > .autopilot/candidate.patch
          sha256sum .autopilot/candidate.patch > .autopilot/candidate.patch.sha256
      - name: Run deterministic evidence suite
        working-directory: candidate
        run: |
          set -euo pipefail
          python -m pytest 2>&1 | tee .autopilot/test-evidence.txt
          (cd frontend && npm ci && npm test -- --run && npm run build) 2>&1 | tee -a .autopilot/test-evidence.txt
          git diff --check
          sha256sum -c .autopilot/candidate.patch.sha256
          git diff --binary HEAD > .autopilot/post-test.patch
          if ! cmp --silent .autopilot/candidate.patch .autopilot/post-test.patch; then
            echo "Tests changed the candidate worktree; refusing mutable evidence"
            exit 2
          fi
      - name: Name immutable candidate artifact
        id: candidate-artifact
        run: |
          printf 'artifact_name=candidate-%s-%s\n' \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.candidate-artifact.outputs.artifact_name }}
          path: |
            candidate/.autopilot/candidate.patch
            candidate/.autopilot/candidate.patch.sha256
            candidate/.autopilot/test-evidence.txt
          if-no-files-found: error
          retention-days: 1

  review:
    needs: [prepare, plan, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      approved: ${{ steps.bind-review.outputs.approved }}
      artifact_name: ${{ steps.bind-review.outputs.artifact_name }}
      model_sha256: ${{ steps.bind-review.outputs.model_sha256 }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: candidate
          persist-credentials: false
      - name: Verify immutable control and candidate checkouts
        env:
          EXPECTED_CONTROL_SHA: ${{ needs.prepare.outputs.control_sha }}
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_CONTROL_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${EXPECTED_BASE_SHA}"
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: ${{ needs.gate.outputs.artifact_name }}
          path: candidate/.autopilot
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: candidate/.autopilot
      - name: Materialize trusted goal-bound review feedback
        env:
          GOAL_FILE: ${{ needs.prepare.outputs.goal_file }}
          EXPECTED_CONTROL_FEEDBACK_SHA256: ${{ needs.prepare.outputs.control_feedback_sha256 }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m atp.autopilot.feedback \
            --repo candidate \
            --control-root . \
            --goal "${GOAL_FILE}" \
            --expected-sha256 "${EXPECTED_CONTROL_FEEDBACK_SHA256}" \
            --materialize
      - name: Prepare read-only review context
        env:
          GOAL_FILE: ${{ needs.prepare.outputs.goal_file }}
          EXPECTED_MODEL_SHA256: ${{ needs.plan.outputs.model_sha256 }}
        working-directory: candidate
        run: |
          set -euo pipefail
          PYTHONPATH="${GITHUB_WORKSPACE}/src" python -m atp.autopilot.model_output \
            --repo . \
            --phase plan \
            --verify \
            --expected-sha256 "${EXPECTED_MODEL_SHA256}"
          printf '%s\n' "${GOAL_FILE}" > .autopilot/goal-path.txt
          sha256sum -c .autopilot/candidate.patch.sha256
          git apply --check --whitespace=error .autopilot/candidate.patch
          git apply --intent-to-add --whitespace=error .autopilot/candidate.patch
      - name: Prepare the private Codex runtime without a prompt
        uses: openai/codex-action@c385816875cc2fc8e033ed9d1cba96f8c331210e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: ${{ runner.temp }}/codex-home
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          allow-bots: true
      - name: Codex independently reviews read-only without log disclosure
        working-directory: ${{ github.workspace }}/candidate
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_PROMPT_FILE: ${{ github.workspace }}/.github/autopilot/prompts/review.md
          CODEX_OUTPUT_FILE: ${{ github.workspace }}/candidate/.autopilot/review.json
          CODEX_OUTPUT_SCHEMA_FILE: ${{ github.workspace }}/.github/autopilot/schemas/review.schema.json
          CODEX_INTERNAL_ORIGINATOR_OVERRIDE: codex_github_action
          FORCE_COLOR: "1"
        run: |
          set -euo pipefail
          umask 077
          private_log="$(mktemp "${RUNNER_TEMP}/codex-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")"
          cleanup_private_codex_log() {
            rm -f -- "${private_log}"
          }
          trap cleanup_private_codex_log EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          chmod 600 "${private_log}"
          test "$(stat -c '%a' "${private_log}")" = "600"
          test -f "${CODEX_PROMPT_FILE}"
          test ! -L "${CODEX_PROMPT_FILE}"
          test -f "${CODEX_OUTPUT_SCHEMA_FILE}"
          test ! -L "${CODEX_OUTPUT_SCHEMA_FILE}"
          test ! -e "${CODEX_OUTPUT_FILE}"
          test ! -L "${CODEX_OUTPUT_FILE}"
          codex exec \
            --skip-git-repo-check \
            --cd "${GITHUB_WORKSPACE}/candidate" \
            --output-last-message "${CODEX_OUTPUT_FILE}" \
            --output-schema "${CODEX_OUTPUT_SCHEMA_FILE}" \
            --config 'model_reasoning_effort="high"' \
            --ephemeral \
            --config 'default_permissions=":read-only"' \
            < "${CODEX_PROMPT_FILE}" \
            > "${private_log}" 2>&1
          test -s "${CODEX_OUTPUT_FILE}"
      - name: Bind trusted initial review
        id: bind-review
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m atp.autopilot.model_output \
            --repo candidate \
            --phase review \
            --bind \
            --github-output "${GITHUB_OUTPUT}"
          printf 'artifact_name=model-review-%s-%s\n' \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.bind-review.outputs.artifact_name }}
          path: candidate/.autopilot/review.json
          if-no-files-found: error
          retention-days: 1

  repair:
    needs: [prepare, plan, gate, review]
    if: needs.review.outputs.approved != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.bind-repair.outputs.artifact_name }}
      model_sha256: ${{ steps.bind-repair.outputs.model_sha256 }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: candidate
          persist-credentials: false
      - name: Verify immutable control and candidate checkouts
        env:
          EXPECTED_CONTROL_SHA: ${{ needs.prepare.outputs.control_sha }}
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_CONTROL_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${EXPECTED_BASE_SHA}"
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: ${{ needs.gate.outputs.artifact_name }}
          path: candidate/.autopilot
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: candidate/.autopilot
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: ${{ needs.review.outputs.artifact_name }}
          path: candidate/.autopilot
      - name: Materialize trusted goal-bound review feedback
        env:
          GOAL_FILE: ${{ needs.prepare.outputs.goal_file }}
          EXPECTED_CONTROL_FEEDBACK_SHA256: ${{ needs.prepare.outputs.control_feedback_sha256 }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m atp.autopilot.feedback \
            --repo candidate \
            --control-root . \
            --goal "${GOAL_FILE}" \
            --expected-sha256 "${EXPECTED_CONTROL_FEEDBACK_SHA256}" \
            --materialize
      - name: Prepare repair context
        env:
          GOAL_FILE: ${{ needs.prepare.outputs.goal_file }}
          EXPECTED_PLAN_SHA256: ${{ needs.plan.outputs.model_sha256 }}
          EXPECTED_REVIEW_SHA256: ${{ needs.review.outputs.model_sha256 }}
        working-directory: candidate
        run: |
          set -euo pipefail
          PYTHONPATH="${GITHUB_WORKSPACE}/src" python -m atp.autopilot.model_output \
            --repo . \
            --phase plan \
            --verify \
            --expected-sha256 "${EXPECTED_PLAN_SHA256}"
          PYTHONPATH="${GITHUB_WORKSPACE}/src" python -m atp.autopilot.model_output \
            --repo . \
            --phase review \
            --verify \
            --expected-sha256 "${EXPECTED_REVIEW_SHA256}"
          sha256sum -c .autopilot/candidate.patch.sha256
          git apply --check --whitespace=error .autopilot/candidate.patch
          git apply --intent-to-add --whitespace=error .autopilot/candidate.patch
          printf '%s\n' "${GOAL_FILE}" > .autopilot/goal-path.txt
      - name: Normalize Claude OAuth token without exposing it
        id: claude_token
        env:
          RAW_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os

          raw = os.environ.get("RAW_CLAUDE_TOKEN", "")
          token = raw.replace("\r", "").replace("\n", "")
          if not token:
              raise SystemExit("Claude OAuth token is empty after normalization")
          if any(character.isspace() for character in token):
              raise SystemExit("Claude OAuth token contains unsupported whitespace")
          if not token.startswith("sk-ant-oat"):
              raise SystemExit("Claude OAuth token has an unexpected format")
          print(f"::add-mask::{token}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"token={token}\n")
          PY
      - name: Claude authors one bounded repair patch
        id: claude-repair
        uses: anthropics/claude-code-base-action@de0c38b60731a9ab4d9637bf4ec3b9679d12c96a
        env:
          CLAUDE_WORKING_DIR: ${{ github.workspace }}/candidate
        with:
          prompt_file: ${{ github.workspace }}/.github/autopilot/prompts/claude-repair.md
          claude_code_oauth_token: ${{ steps.claude_token.outputs.token }}
          show_full_output: "false"
          claude_args: >-
            --model opus
            --max-turns 25
            --max-budget-usd 20
            --allowedTools "Read,Glob,Grep"
            --disallowedTools "Bash,Edit,Write,NotebookEdit,WebFetch,WebSearch,Task,mcp__*"
            --json-schema '{"type":"object","additionalProperties":false,"required":["author","patch","changed_files"],"properties":{"author":{"type":"string","enum":["claude"]},"patch":{"type":"string"},"changed_files":{"type":"array","minItems":1,"items":{"type":"string"}}}}'
      - name: Bind trusted repair output
        id: bind-repair
        env:
          EXECUTION_FILE: ${{ steps.claude-repair.outputs.execution_file }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m atp.autopilot.model_output \
            --repo candidate \
            --phase repair \
            --bind \
            --execution-file "${EXECUTION_FILE}" \
            --runner-temp "${RUNNER_TEMP}" \
            --github-output "${GITHUB_OUTPUT}"
          printf 'artifact_name=model-repair-%s-%s\n' \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.bind-repair.outputs.artifact_name }}
          path: candidate/.autopilot/repair.json
          if-no-files-found: error
          retention-days: 1

  gate_repair:
    needs: [prepare, gate, review, repair]
    if: needs.review.outputs.approved != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.repaired-artifact.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: candidate
          persist-credentials: false
      - name: Verify immutable control and candidate checkouts
        env:
          EXPECTED_CONTROL_SHA: ${{ needs.prepare.outputs.control_sha }}
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_CONTROL_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${EXPECTED_BASE_SHA}"
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: "3.12"
      - uses: actions/setup-node@3d7870f6218881292d183093179901ae8dc2ef85
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: candidate/frontend/package-lock.json
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: ${{ needs.gate.outputs.artifact_name }}
          path: candidate/.autopilot
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: ${{ needs.repair.outputs.artifact_name }}
          path: candidate/.autopilot
      - name: Validate and apply bounded repair
        env:
          GOAL_FILE: ${{ needs.prepare.outputs.goal_file }}
          EXPECTED_MODEL_SHA256: ${{ needs.repair.outputs.model_sha256 }}
        working-directory: candidate
        run: |
          set -euo pipefail
          PYTHONPATH="${GITHUB_WORKSPACE}/src" python -m atp.autopilot.model_output \
            --repo . \
            --phase repair \
            --verify \
            --expected-sha256 "${EXPECTED_MODEL_SHA256}"
          python -m pip install -e '.[dev,live]'
          PYTHONPATH="${GITHUB_WORKSPACE}/src" python -m atp.autopilot.guard --repo . --goal "${GOAL_FILE}" --declared-json .autopilot/repair.json --declared-only
          sha256sum -c .autopilot/candidate.patch.sha256
          git apply --check --whitespace=error .autopilot/candidate.patch
          git apply --intent-to-add --whitespace=error .autopilot/candidate.patch
          git add -A
          git -c user.name=autopilot-gate -c user.email=autopilot-gate@users.noreply.github.com -c commit.gpgsign=false commit -m "Temporary candidate baseline"
          python -c 'import json; from pathlib import Path; source = Path(".autopilot/repair.json"); patch = json.loads(source.read_text(encoding="utf-8"))["patch"]; Path(".autopilot/repair.patch").write_text(patch.rstrip(chr(13) + chr(10)) + chr(10), encoding="utf-8")'
          git apply --check --recount --whitespace=error .autopilot/repair.patch
          git apply --intent-to-add --recount --whitespace=error .autopilot/repair.patch
          PYTHONPATH="${GITHUB_WORKSPACE}/src" python -m atp.autopilot.guard --repo . --goal "${GOAL_FILE}" --declared-json .autopilot/repair.json
          git diff --check HEAD^
          git diff --binary HEAD^ > .autopilot/repaired.patch
          sha256sum .autopilot/repaired.patch > .autopilot/repaired.patch.sha256
      - name: Re-run deterministic evidence suite
        working-directory: candidate
        run: |
          set -euo pipefail
          python -m pytest 2>&1 | tee .autopilot/test-evidence.txt
          (cd frontend && npm ci && npm test -- --run && npm run build) 2>&1 | tee -a .autopilot/test-evidence.txt
          git diff --check HEAD^
          sha256sum -c .autopilot/repaired.patch.sha256
          git diff --binary HEAD^ > .autopilot/post-test-repaired.patch
          if ! cmp --silent .autopilot/repaired.patch .autopilot/post-test-repaired.patch; then
            echo "Tests changed the repaired worktree; refusing mutable evidence"
            exit 2
          fi
      - name: Name immutable repaired artifact
        id: repaired-artifact
        run: |
          printf 'artifact_name=repaired-%s-%s\n' \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.repaired-artifact.outputs.artifact_name }}
          path: |
            candidate/.autopilot/repaired.patch
            candidate/.autopilot/repaired.patch.sha256
            candidate/.autopilot/test-evidence.txt
          if-no-files-found: error
          retention-days: 1

  final_review:
    needs: [prepare, plan, review, gate_repair]
    if: needs.review.outputs.approved != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      approved: ${{ steps.bind-final-review.outputs.approved }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: candidate
          persist-credentials: false
      - name: Verify immutable control and candidate checkouts
        env:
          EXPECTED_CONTROL_SHA: ${{ needs.prepare.outputs.control_sha }}
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_CONTROL_SHA}"
          test "$(git -C candidate rev-parse HEAD)" = "${EXPECTED_BASE_SHA}"
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: ${{ needs.gate_repair.outputs.artifact_name }}
          path: candidate/.autopilot
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: candidate/.autopilot
      - name: Materialize trusted goal-bound review feedback
        env:
          GOAL_FILE: ${{ needs.prepare.outputs.goal_file }}
          EXPECTED_CONTROL_FEEDBACK_SHA256: ${{ needs.prepare.outputs.control_feedback_sha256 }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m atp.autopilot.feedback \
            --repo candidate \
            --control-root . \
            --goal "${GOAL_FILE}" \
            --expected-sha256 "${EXPECTED_CONTROL_FEEDBACK_SHA256}" \
            --materialize
      - name: Prepare final read-only review
        env:
          GOAL_FILE: ${{ needs.prepare.outputs.goal_file }}
          EXPECTED_MODEL_SHA256: ${{ needs.plan.outputs.model_sha256 }}
        working-directory: candidate
        run: |
          set -euo pipefail
          PYTHONPATH="${GITHUB_WORKSPACE}/src" python -m atp.autopilot.model_output \
            --repo . \
            --phase plan \
            --verify \
            --expected-sha256 "${EXPECTED_MODEL_SHA256}"
          printf '%s\n' "${GOAL_FILE}" > .autopilot/goal-path.txt
          sha256sum -c .autopilot/repaired.patch.sha256
          git apply --check --whitespace=error .autopilot/repaired.patch
          git apply --intent-to-add --whitespace=error .autopilot/repaired.patch
      - name: Prepare the private Codex runtime without a prompt
        uses: openai/codex-action@c385816875cc2fc8e033ed9d1cba96f8c331210e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: ${{ runner.temp }}/codex-home
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          allow-bots: true
      - name: Codex gives the final verdict without log disclosure
        working-directory: ${{ github.workspace }}/candidate
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_PROMPT_FILE: ${{ github.workspace }}/.github/autopilot/prompts/review.md
          CODEX_OUTPUT_FILE: ${{ github.workspace }}/candidate/.autopilot/final-review.json
          CODEX_OUTPUT_SCHEMA_FILE: ${{ github.workspace }}/.github/autopilot/schemas/review.schema.json
          CODEX_INTERNAL_ORIGINATOR_OVERRIDE: codex_github_action
          FORCE_COLOR: "1"
        run: |
          set -euo pipefail
          umask 077
          private_log="$(mktemp "${RUNNER_TEMP}/codex-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")"
          cleanup_private_codex_log() {
            rm -f -- "${private_log}"
          }
          trap cleanup_private_codex_log EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          chmod 600 "${private_log}"
          test "$(stat -c '%a' "${private_log}")" = "600"
          test -f "${CODEX_PROMPT_FILE}"
          test ! -L "${CODEX_PROMPT_FILE}"
          test -f "${CODEX_OUTPUT_SCHEMA_FILE}"
          test ! -L "${CODEX_OUTPUT_SCHEMA_FILE}"
          test ! -e "${CODEX_OUTPUT_FILE}"
          test ! -L "${CODEX_OUTPUT_FILE}"
          codex exec \
            --skip-git-repo-check \
            --cd "${GITHUB_WORKSPACE}/candidate" \
            --output-last-message "${CODEX_OUTPUT_FILE}" \
            --output-schema "${CODEX_OUTPUT_SCHEMA_FILE}" \
            --config 'model_reasoning_effort="high"' \
            --ephemeral \
            --config 'default_permissions=":read-only"' \
            < "${CODEX_PROMPT_FILE}" \
            > "${private_log}" 2>&1
          test -s "${CODEX_OUTPUT_FILE}"
      - name: Bind trusted final review
        id: bind-final-review
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m atp.autopilot.model_output \
            --repo candidate \
            --phase final_review \
            --bind \
            --github-output "${GITHUB_OUTPUT}"

  verdict:
    needs: [prepare, gate, review, repair, gate_repair, final_review]
    if: >-
      always() &&
      !cancelled() &&
      needs.prepare.outputs.has_goal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      approved_first: ${{ steps.select.outputs.approved_first }}
      artifact_name: ${{ steps.select.outputs.artifact_name }}
    steps:
      - name: Select the only publishable reviewed artifact
        id: select
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          REVIEW_RESULT: ${{ needs.review.result }}
          INITIAL_APPROVED: ${{ needs.review.outputs.approved }}
          REPAIR_RESULT: ${{ needs.repair.result }}
          REPAIR_GATE_RESULT: ${{ needs.gate_repair.result }}
          FINAL_REVIEW_RESULT: ${{ needs.final_review.result }}
          FINAL_APPROVED: ${{ needs.final_review.outputs.approved }}
          CANDIDATE_ARTIFACT_NAME: ${{ needs.gate.outputs.artifact_name }}
          REPAIRED_ARTIFACT_NAME: ${{ needs.gate_repair.outputs.artifact_name }}
        run: |
          set -euo pipefail
          fail() {
            echo "No fully gated and approved artifact is publishable"
            exit 2
          }
          if [ "${GATE_RESULT}" != "success" ] || [ "${REVIEW_RESULT}" != "success" ]; then
            fail
          fi
          case "${INITIAL_APPROVED}" in
            true)
              if [ "${REPAIR_RESULT}" != "skipped" ] ||
                 [ "${REPAIR_GATE_RESULT}" != "skipped" ] ||
                 [ "${FINAL_REVIEW_RESULT}" != "skipped" ]; then
                fail
              fi
              if [[ ! "${CANDIDATE_ARTIFACT_NAME}" =~ ^candidate-${GITHUB_RUN_ID}-[1-9][0-9]*$ ]]; then
                fail
              fi
              artifact_name="${CANDIDATE_ARTIFACT_NAME}"
              approved_first=true
              ;;
            false)
              if [ "${REPAIR_RESULT}" != "success" ] ||
                 [ "${REPAIR_GATE_RESULT}" != "success" ] ||
                 [ "${FINAL_REVIEW_RESULT}" != "success" ] ||
                 [ "${FINAL_APPROVED}" != "true" ]; then
                fail
              fi
              if [[ ! "${REPAIRED_ARTIFACT_NAME}" =~ ^repaired-${GITHUB_RUN_ID}-[1-9][0-9]*$ ]]; then
                fail
              fi
              artifact_name="${REPAIRED_ARTIFACT_NAME}"
              approved_first=false
              ;;
            *)
              fail
              ;;
          esac
          printf 'approved_first=%s\nartifact_name=%s\n' \
            "${approved_first}" "${artifact_name}" >> "${GITHUB_OUTPUT}"

  publish:
    needs: [prepare, verdict]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: candidate
          fetch-depth: 0
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: ${{ needs.verdict.outputs.artifact_name }}
          path: candidate/.autopilot
      - name: Publish only the reviewed patch to the workbench draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          GOAL_ID: ${{ needs.prepare.outputs.goal_id }}
          APPROVED_FIRST: ${{ needs.verdict.outputs.approved_first }}
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        working-directory: candidate
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "${EXPECTED_BASE_SHA}" ]; then
            echo "Publisher checkout does not match the reviewed base"
            exit 2
          fi
          git fetch origin "refs/heads/${WORKBENCH_BRANCH}:refs/remotes/origin/${WORKBENCH_BRANCH}"
          if [ "$(git rev-parse "refs/remotes/origin/${WORKBENCH_BRANCH}")" != "${EXPECTED_BASE_SHA}" ]; then
            echo "Workbench advanced after review; refusing stale publication"
            exit 2
          fi
          if [ "${APPROVED_FIRST}" = "true" ]; then
            PATCH=.autopilot/candidate.patch
            sha256sum -c .autopilot/candidate.patch.sha256
          else
            PATCH=.autopilot/repaired.patch
            sha256sum -c .autopilot/repaired.patch.sha256
          fi
          git apply --check --whitespace=error "${PATCH}"
          git apply --intent-to-add --whitespace=error "${PATCH}"
          mkdir -p docs/autopilot/completed
          jq -n --arg goal "${GOAL_ID}" --arg run "${GITHUB_RUN_ID}" '{goal_id: $goal, github_run_id: $run, status: "CODEX_APPROVED"}' > "docs/autopilot/completed/${GOAL_ID}.json"
          git config user.name "claude-autopilot[bot]"
          git config user.email "claude-autopilot[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Claude: complete ${GOAL_ID}"
          PR_JSON="$(gh pr view "${WORKBENCH_PR_NUMBER}" --json number,state,isDraft,headRefName,baseRefName,headRefOid)"
          if ! jq -e \
            --argjson expected_number "${WORKBENCH_PR_NUMBER}" \
            --arg expected_head "${WORKBENCH_BRANCH}" \
            --arg expected_base "main" \
            --arg expected_sha "${EXPECTED_BASE_SHA}" \
            '.number == $expected_number and
             .state == "OPEN" and
             .isDraft == true and
             .headRefName == $expected_head and
             .baseRefName == $expected_base and
             .headRefOid == $expected_sha' \
            <<< "${PR_JSON}" >/dev/null; then
            echo "Existing workbench Draft PR #${WORKBENCH_PR_NUMBER} is missing or does not match the reviewed base"
            exit 2
          fi
          git push origin "HEAD:refs/heads/${WORKBENCH_BRANCH}"
          gh pr comment "${WORKBENCH_PR_NUMBER}" --body "Completed trusted goal \`${GOAL_ID}\` in run \`${GITHUB_RUN_ID}\`. Claude authored; Codex approved; deterministic gates passed."
